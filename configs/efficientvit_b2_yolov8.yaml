# EfficientViT-B2 + YOLOv8 detection head
# Backbone: MIT Han Lab EfficientViT-B2 (LiteMLA, O(n) linear attention)
# Neck+Head: YOLOv8-medium-scale PANet + Detect (192/384/576 channels)
#
# B2 config: width=[24,48,96,192,384], depth=[1,3,4,4,6], head_dim=32
# ImageNet-1K Top-1: 82.10% (pretrained weights from MIT Han Lab)

nc: 2
depth_multiple: 1.0
width_multiple: 1.0

# ============================================================
# Backbone: EfficientViT-B2
# ============================================================
# Channel flow:    3 -> 24 -> 48 -> 96 -> 192 -> 384
# Spatial stride:  /2    /4    /8    /16    /32
backbone:
  - [-1, 1, EfficientViTStem, [24, 1]]                          # 0: 24ch, stride 2
  - [-1, 1, EfficientViTLocalStage, [48, 3, 4]]                 # 1: 48ch, stride 4
  - [-1, 1, EfficientViTLocalStage, [96, 4, 4]]                 # 2: 96ch, stride 8  (P3)
  - [-1, 1, EfficientViTAttentionStage, [192, 4, 32, 4]]        # 3: 192ch, stride 16 (P4)
  - [-1, 1, EfficientViTAttentionStage, [384, 6, 32, 4]]        # 4: 384ch, stride 32 (P5)

# ============================================================
# Head: YOLOv8-medium-scale PANet + Detect
# ============================================================
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 5
  - [[-1, 3], 1, Concat, [1]]                        # 6
  - [-1, 2, C2f, [384]]                              # 7  (P4 scale)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 8
  - [[-1, 2], 1, Concat, [1]]                        # 9
  - [-1, 2, C2f, [192]]                              # 10 (P3 scale)

  - [-1, 1, Conv, [192, 3, 2]]                       # 11
  - [[-1, 7], 1, Concat, [1]]                        # 12
  - [-1, 2, C2f, [384]]                              # 13 (P4 scale)

  - [-1, 1, Conv, [384, 3, 2]]                       # 14
  - [[-1, 4], 1, Concat, [1]]                        # 15
  - [-1, 2, C2f, [576]]                              # 16 (P5 scale)

  - [[10, 13, 16], 1, Detect, [nc]]                  # 17
