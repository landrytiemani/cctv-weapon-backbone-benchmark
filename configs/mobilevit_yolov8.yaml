# MobileViT-S + YOLOv8 detection head (competitor family A)
# Backbone: Apple MobileViT-S (Mehta & Rastegari, ICLR 2022)
# Source: timm.create_model("mobilevit_s", pretrained=True, features_only=True)
#
# Per-stage output channels (verified with
#   python scripts/discover_timm_channels.py mobilevit_s ):
#   stage_idx=0  stride=/4   ch=64
#   stage_idx=1  stride=/8   ch=96
#   stage_idx=2  stride=/16  ch=128
#   stage_idx=3  stride=/32  ch=640   <-- final 1x1 expansion before classifier
#
# Note: the wide 640-channel P5 forces a NARROWER YOLOv8 neck (YOLOv8n-scale
# 64/128/256 instead of YOLOv8s-scale 128/256/512). The wider-neck variant
# OOMs even at batch=2 on a 20 GB GPU because the final C2f processes
# (640+256)=896 input channels.

nc: 2
depth_multiple: 1.0
width_multiple: 1.0

# ============================================================
# Backbone: MobileViT-S via timm
# ============================================================
backbone:
  - [-1, 1, TimmStem, [64, "mobilevit_s", True]]      # 0: stride 4,  c=64   (P2)
  - [-1, 1, TimmStage, [96, 1]]                        # 1: stride 8,  c=96   (P3)
  - [-1, 1, TimmStage, [128, 2]]                       # 2: stride 16, c=128  (P4)
  - [-1, 1, TimmStage, [640, 3]]                       # 3: stride 32, c=640  (P5)

# ============================================================
# Head: PANet + Detect (YOLOv8n-scale, 64/128/256)
# ============================================================
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 4
  - [[-1, 2], 1, Concat, [1]]                        # 5  cat(up(P5), P4) = 640+128 = 768
  - [-1, 2, C2f, [128]]                              # 6

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 7
  - [[-1, 1], 1, Concat, [1]]                        # 8  cat(up, P3) = 128+96 = 224
  - [-1, 2, C2f, [64]]                               # 9  (P3 scale)

  - [-1, 1, Conv, [64, 3, 2]]                        # 10
  - [[-1, 6], 1, Concat, [1]]                        # 11 cat(down, td1) = 64+128 = 192
  - [-1, 2, C2f, [128]]                              # 12 (P4 scale)

  - [-1, 1, Conv, [128, 3, 2]]                       # 13
  - [[-1, 3], 1, Concat, [1]]                        # 14 cat(down, P5) = 128+640 = 768
  - [-1, 2, C2f, [256]]                              # 15 (P5 scale)

  - [[9, 12, 15], 1, Detect, [nc]]                   # 16
